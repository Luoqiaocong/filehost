name = "filehost"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# 保留了 routes 之后 wrangler 默认会关掉 workers.dev，显式打开免得旧链接失效
workers_dev = true

[vars]
SITE_NAME = "文件托管"
# Workers 请求体硬上限 100MB，超过这个值的上传在 Cloudflare 边缘就会被拒，调大没有意义。
MAX_UPLOAD_MB = "100"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "filehost-bucket"

[[d1_databases]]
binding = "DB"
database_name = "filehost-db"
# 运行 `npm run setup` 会自动把这里替换为真实的 database_id
database_id = "58c63ea9-e5fe-418e-95a8-5f0266b03d9e"
migrations_dir = "migrations"

# 优选 IP 下载域：DNS 里给 dl 建一条「代理」状态的 A 记录，指向挑选过的
# Cloudflare 节点 IP（比如 172.66.0.1），国内直连会比默认解析到的 IP 快几倍。
# 用 route 而不是 Custom Domain，是为了让 DNS 记录完全由自己掌控。
[[routes]]
pattern = "dl.heiseven.top/*"
zone_name = "heiseven.top"

# 静态资源（站点图标）。先跑 Worker，未命中的路径才回落到这些文件。
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
